name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app php:8.3-cli \
            sh -c 'find src -name "*.php" -print0 | xargs -0 -n1 php -l'
